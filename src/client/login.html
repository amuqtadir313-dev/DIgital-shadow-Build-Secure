<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MarketHub</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        Market<span>Hub</span>
    </div>

    <nav class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./index.html#products">Products</a>
        <a href="./register.html" class="nav-button">Register</a>
    </nav>
</header>

<main class="auth-page">

    <div class="auth-card">

        <div class="security-badge">
            🔐 Secure Authentication
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Sign in to access your MarketHub account.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div id="loginMessage" class="form-message"></div>

            <button
                type="submit"
                class="primary-button auth-button"
            >
                Login Securely
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="./register.html">Create one</a>
        </p>

    </div>

</main>

<script src="./js/app.js"></script>

</body>
</html>
