<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MarketHub</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        Market<span>Hub</span>
    </div>

    <nav class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./index.html#products">Products</a>
        <a href="./login.html">Login</a>
    </nav>

</header>

<main class="auth-page">

    <div class="auth-card">

        <div class="security-badge">
            🛡️ Create Secure Account
        </div>

        <h1>Join MarketHub</h1>

        <p class="auth-subtitle">
            Create your account and start using the marketplace.
        </p>

        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your full name"
                    maxlength="100"
                    required
                    autocomplete="name"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    maxlength="255"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    required
                    autocomplete="new-password"
                >

            </div>


            <div class="form-group">

                <label for="role">
                    Account Type
                </label>

                <select id="role" name="role">

                    <option value="customer">
                        Customer
                    </option>

                    <option value="vendor">
                        Vendor
                    </option>

                </select>

            </div>


            <div id="registerMessage" class="form-message"></div>


            <button
                type="submit"
                class="primary-button auth-button"
            >
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="./login.html">
                Login
            </a>

        </p>

    </div>

</main>

<script src="./js/app.js"></script>

</body>
</html>
